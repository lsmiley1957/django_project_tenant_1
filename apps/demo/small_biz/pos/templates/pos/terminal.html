{% extends "inventory/base.html" %}

{% block content %}
<style>
    /* 1. COMPACT CARD UI */
    .product-card {
        transition: all 0.2s;
        border: 1px solid #e9ecef !important;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        border-radius: 12px;
    }

    .product-title {
        font-size: 0.8rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 2.2rem;
        line-height: 1.1rem;
        font-weight: 600;
    }

    .btn-xs {
        padding: 0.2rem 0.5rem;
        font-size: 0.7rem;
    }

    /* 2. 2-SECOND HOVER IMAGE OVERLAY */
    .product-image-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        z-index: 10;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        transition-delay: 0s; /* Disappear instantly when mouse leaves */
    }

    .product-card:hover .product-image-overlay {
        opacity: 1;
        visibility: visible;
        transition-delay: 2s; /* Only show after 2 seconds of lingering */
    }

    .product-image-overlay img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 8px;
    }

    .no-image-placeholder {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
        color: #adb5bd;
        font-size: 0.65rem;
        text-transform: uppercase;
    }

    /* 3. CART SIDEBAR STYLING */
    #cartItemsList::-webkit-scrollbar {
        width: 5px;
    }
    #cartItemsList::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
    }
</style>

<div class="container-fluid py-3 h-100">
    <div class="row h-100">
        <div class="col-lg-9 col-md-8">
            <div class="card shadow-sm border-0 rounded-4 mb-3">
                <div class="card-header bg-white border-0 py-3">
                    <div class="row align-items-center">
                        <div class="col"><h5 class="mb-0 fw-bold">POS Terminal</h5></div>
                        <div class="col-md-5">
                            <div class="input-group input-group-sm rounded-pill border bg-light px-2">
                                <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                                <input type="text" id="productSearch" class="form-control border-0 bg-transparent shadow-none" placeholder="Search SKU or Name...">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body overflow-auto" style="max-height: 82vh;">
                    <div class="row g-2" id="productGrid">
                        {% for product in products %}
                        <div class="col-xl-2 col-lg-3 col-md-4 col-6 product-item"
                             data-name="{{ product.name|lower }}"
                             data-sku="{{ product.sku|lower }}">

                            <div class="card product-card h-100 shadow-none text-center">
                                <div class="product-image-overlay">
                                    {% if product.main_image %}
                                        <img src="{{ product.main_image.url }}" alt="{{ product.name }}">
                                    {% else %}
                                        <div class="no-image-placeholder">No Image</div>
                                    {% endif %}
                                </div>

                                <div class="card-body p-2 d-flex flex-column justify-content-between">
                                    <div>
                                        <small class="text-muted d-block small mb-1">{{ product.sku }}</small>
                                        <h6 class="product-title mb-1 text-dark">{{ product.name }}</h6>
                                    </div>

                                    <div class="mt-2">
                                        <div class="text-primary fw-bold mb-2 small">${{ product.sale_price }}</div>
                                        <button class="btn btn-primary btn-xs w-100 rounded-pill"
                                                onclick="addToCart('{{ product.id }}', '{{ product.name|escapejs }}', '{{ product.sale_price }}')">
                                            <i class="fas fa-plus me-1"></i>Add
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-3 col-md-4">
            <div class="card shadow-sm border-0 rounded-4 h-100 d-flex flex-column">
                <div class="card-header bg-white py-3">
                    <h6 class="mb-0 fw-bold"><i class="fas fa-shopping-basket me-2"></i>Current Order</h6>
                </div>

                <div class="card-body d-flex flex-column flex-grow-1 overflow-hidden">
                    <div id="cartItemsList" class="flex-grow-1 overflow-auto pe-1">
                        <div id="emptyCartMsg" class="text-center py-5">
                            <i class="fas fa-cart-arrow-down fa-3x text-light mb-3"></i>
                            <p class="text-muted small">Cart is empty</p>
                        </div>
                    </div>

                    <div class="border-top pt-3 mt-auto">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Total Amount</span>
                            <span class="h4 mb-0 fw-bold text-primary">$<span id="cartTotal">0.00</span></span>
                        </div>

                        <div class="mb-2">
                            <label class="small text-muted mb-1">Customer</label>
                            <select id="customerSelect" class="form-select form-select-sm rounded-pill">
                                <option value="">Walk-in Customer</option>
                                {% for cust in acct_customers %}
                                <option value="{{ cust.id }}">{{ cust.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted mb-1">Payment</label>
                            <select id="paymentMethod" class="form-select form-select-sm rounded-pill">
                                <option value="CASH">Cash Payment</option>
                                <option value="CARD">Credit/Debit Card</option>
                            </select>
                        </div>

                        <button id="checkoutBtn" onclick="processCheckout()" class="btn btn-success w-100 py-2 rounded-pill shadow-sm fw-bold">
                            COMPLETE SALE
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 1. GLOBAL CART STATE
let cart = [];

function addToCart(id, name, price) {
    const itemPrice = parseFloat(price);
    const existingItem = cart.find(item => item.id === id);

    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({
            id: id,
            name: name,
            price: itemPrice,
            quantity: 1
        });
    }
    updateCartUI();
}

function updateCartUI() {
    const listContainer = document.getElementById('cartItemsList');
    const totalEl = document.getElementById('cartTotal');
    const emptyMsg = document.getElementById('emptyCartMsg');
    const checkoutBtn = document.getElementById('checkoutBtn');

    listContainer.innerHTML = '';
    let total = 0;

    if (cart.length === 0) {
        listContainer.appendChild(emptyMsg);
        totalEl.innerText = "0.00";
        checkoutBtn.disabled = true;
        return;
    }

    checkoutBtn.disabled = false;

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const itemRow = document.createElement('div');
        itemRow.className = 'd-flex align-items-center mb-2 p-2 bg-light rounded-3 animate__animated animate__fadeIn';
        itemRow.innerHTML = `
            <div class="flex-grow-1">
                <div class="small fw-bold text-truncate" style="max-width: 140px;">${item.name}</div>
                <div class="text-muted small">$${item.price.toFixed(2)} x ${item.quantity}</div>
            </div>
            <div class="text-end me-2">
                <div class="small fw-bold text-primary">$${itemTotal.toFixed(2)}</div>
            </div>
            <button onclick="removeFromCart(${index})" class="btn btn-sm text-danger p-0 border-0">
                <i class="fas fa-times-circle"></i>
            </button>
        `;
        listContainer.appendChild(itemRow);
    });

    totalEl.innerText = total.toFixed(2);
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
}

// 2. BACKEND INTEGRATION
async function processCheckout() {
    if (cart.length === 0) return;

    const checkoutBtn = document.getElementById('checkoutBtn');
    const originalText = checkoutBtn.innerHTML;

    checkoutBtn.disabled = true;
    checkoutBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

    const payload = {
        cart: cart,
        customer_id: document.getElementById('customerSelect').value,
        payment_method: document.getElementById('paymentMethod').value
    };

    try {
        const response = await fetch('/pos/pos/checkout/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.status === 'success') {
            window.location.href = result.redirect_url;
        } else {
            alert("Checkout Error: " + (result.message || "Unknown error"));
            checkoutBtn.disabled = false;
            checkoutBtn.innerHTML = originalText;
        }
    } catch (e) {
        console.error("Fetch Error:", e);
        alert("Failed to connect to the server.");
        checkoutBtn.disabled = false;
        checkoutBtn.innerHTML = originalText;
    }
}

// 3. SEARCH LOGIC
document.getElementById('productSearch').addEventListener('input', function(e) {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('.product-item').forEach(el => {
        const name = el.getAttribute('data-name');
        const sku = el.getAttribute('data-sku');
        if (name.includes(term) || sku.includes(term)) {
            el.style.display = 'block';
        } else {
            el.style.display = 'none';
        }
    });
});

// Initialization
document.addEventListener('DOMContentLoaded', updateCartUI);
</script>
{% endblock %}
