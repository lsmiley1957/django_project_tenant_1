{% extends "inventory/base.html" %}

{% block content %}
<div class="container-fluid py-4 h-100">
    <div class="row h-100">
        <!-- Product Selection Area -->
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-4 mb-4">
                <div class="card-header bg-white border-0 pt-4">
                    <div class="row align-items-center">
                        <div class="col">
                            <h4 class="mb-0">Select Products</h4>
                        </div>
                        <div class="col-md-6">
                            <div class="input-group rounded-pill border bg-light px-3">
                                <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                                <input type="text" id="productSearch" class="form-control border-0 bg-transparent shadow-none" placeholder="Search by name or SKU...">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body overflow-auto" style="max-height: 70vh;">
                    <div class="row g-3" id="productGrid">
                        {% for product in products %}
                        <div class="col-md-4 col-sm-6 product-item" data-name="{{ product.name|lower }}" data-sku="{{ product.sku|lower }}">
                            <!-- Added data attributes here to safely store info -->
                            <div class="card h-100 border rounded-4 product-card cursor-pointer add-to-cart-trigger"
                                 style="cursor: pointer;"
                                 data-id="{{ product.id }}"
                                 data-product-name="{{ product.name }}"
                                 data-price="{{ product.sale_price }}">
                                <div class="card-body text-center">
                                    <div class="bg-light rounded-4 mb-3 d-flex align-items-center justify-content-center" style="height: 100px;">
                                        <i class="fas fa-box fa-2x text-muted opacity-50"></i>
                                    </div>
                                    <h6 class="mb-1 text-truncate">{{ product.name }}</h6>
                                    <p class="text-primary fw-bold mb-0">${{ product.sale_price }}</p>
                                    <small class="text-muted">Stock: {{ product.stock_quantity }}</small>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <!-- Checkout Sidebar -->
        <div class="col-lg-4">
            <div class="card shadow border-0 rounded-4 h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="mb-4">Current Order</h5>

                    <div class="mb-4">
                        <label class="small text-muted text-uppercase fw-bold">Customer</label>
                        <select id="customerSelect" class="form-select border-0 bg-light rounded-3">
                            {% for acct_customer in acct_customers %}
                            <option value="{{ acct_customer.id }}">{{ acct_customer.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Cart Items -->
                    <div id="cartItems" class="flex-grow-1 overflow-auto mb-4" style="max-height: 40vh;">
                        <div class="text-center py-5 text-muted empty-cart-msg">
                            <i class="fas fa-shopping-cart fa-3x mb-3 opacity-20"></i>
                            <p>Cart is empty</p>
                        </div>
                    </div>

                    <!-- Totals -->
                    <div class="border-top pt-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span id="subtotalLabel">$0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <h4 class="mb-0">Total</h4>
                            <h4 class="mb-0 text-primary" id="totalLabel">$0.00</h4>
                        </div>
                        <button onclick="completeSale()" id="checkoutBtn" class="btn btn-primary w-100 rounded-pill py-3 fw-bold" disabled>
                            <i class="fas fa-credit-card me-2"></i> Complete Sale
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let cart = [];

// Catch clicks on any product card and pulls data from attributes
document.getElementById('productGrid').addEventListener('click', function(e) {
    const trigger = e.target.closest('.add-to-cart-trigger');
    if (trigger) {
        const id = trigger.getAttribute('data-id');
        const name = trigger.getAttribute('data-product-name');
        const price = parseFloat(trigger.getAttribute('data-price'));
        addToCart(id, name, price);
    }
});

function addToCart(id, name, price) {
    const existing = cart.find(item => item.id === id);
    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({ id, name, price, quantity: 1 });
    }
    renderCart();
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    renderCart();
}

function updateQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) removeFromCart(id);
        else renderCart();
    }
}

function renderCart() {
    const container = document.getElementById('cartItems');
    const checkoutBtn = document.getElementById('checkoutBtn');

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5 text-muted empty-cart-msg">
                <i class="fas fa-shopping-cart fa-3x mb-3 opacity-20"></i>
                <p>Cart is empty</p>
            </div>`;
        checkoutBtn.disabled = true;
        document.getElementById('subtotalLabel').innerText = '$0.00';
        document.getElementById('totalLabel').innerText = '$0.00';
        return;
    }

    checkoutBtn.disabled = false;
    container.innerHTML = '';
    let total = 0;

    cart.forEach(item => {
        const lineTotal = item.price * item.quantity;
        total += lineTotal;

        const safeName = item.name.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

        const itemEl = document.createElement('div');
        itemEl.className = 'd-flex align-items-center mb-3 p-2 bg-light rounded-3';
        itemEl.innerHTML = `
            <div class="flex-grow-1">
                <h6 class="mb-0 small fw-bold">${safeName}</h6>
                <small class="text-muted">$${item.price} x ${item.quantity}</small>
            </div>
            <div class="d-flex align-items-center">
                <button onclick="updateQty('${item.id}', -1)" class="btn btn-sm btn-white border shadow-none p-1 px-2"><i class="fas fa-minus fa-xs"></i></button>
                <span class="mx-2 small fw-bold">${item.quantity}</span>
                <button onclick="updateQty('${item.id}', 1)" class="btn btn-sm btn-white border shadow-none p-1 px-2"><i class="fas fa-plus fa-xs"></i></button>
            </div>
            <div class="ms-3 text-end" style="min-width: 60px;">
                <span class="small fw-bold">$${lineTotal.toFixed(2)}</span>
            </div>
        `;
        container.appendChild(itemEl);
    });

    document.getElementById('subtotalLabel').innerText = `$${total.toFixed(2)}`;
    document.getElementById('totalLabel').innerText = `$${total.toFixed(2)}`;
}

async function completeSale() {
    const acct_customerId = document.getElementById('customerSelect').value;
    const checkoutBtn = document.getElementById('checkoutBtn');

    // Prevent empty sales
    if (cart.length === 0) return;

    checkoutBtn.disabled = true;
    checkoutBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Processing...';

    try {
        // Use Django's URL tag to ensure we hit the correct endpoint
        const response = await fetch("{% url 'pos_checkout' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                acct_customer_id: acct_customerId,
                cart: cart
            })
        });

        const result = await response.json();

        if (result.status === 'success') {
            // Success: Redirect to the newly created invoice detail page
            window.location.href = result.redirect_url;
        } else {
            // Show error message from backend
            alert("Error: " + result.message);
            checkoutBtn.disabled = false;
            checkoutBtn.innerHTML = '<i class="fas fa-credit-card me-2"></i> Complete Sale';
        }
    } catch (e) {
        console.error("POS Checkout Error:", e);
        alert("A system error occurred. Please check the console.");
        checkoutBtn.disabled = false;
        checkoutBtn.innerHTML = '<i class="fas fa-credit-card me-2"></i> Complete Sale';
    }
}

// Search Functionality
document.getElementById('productSearch').addEventListener('input', function(e) {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('.product-item').forEach(el => {
        const name = el.getAttribute('data-name');
        const sku = el.getAttribute('data-sku');
        if (name.includes(term) || sku.includes(term)) {
            el.classList.remove('d-none');
        } else {
            el.classList.add('d-none');
        }
    });
});
</script>
<style>
    .product-card { transition: all 0.2s; border: 1px solid #eee !important; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #5e72e4 !important; }
    .cursor-pointer { cursor: pointer; }
    .btn-white { background: white; color: #333; }
</style>
{% endblock %}
