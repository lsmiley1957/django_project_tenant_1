{% extends "inventory/base.html" %}

{% block content %}

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card shadow border-0 rounded-4">
<div class="card-body p-lg-5">
<div class="text-center mb-4">
<div class="icon icon-shape text-white rounded-circle shadow mb-3" style="width: 65px; height: 65px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%);">
<i class="fas fa-user-plus fa-lg"></i>
</div>
<h2 class="h4">Register New Customer</h2>
<p class="text-muted small">Establish a profile for invoicing and loyalty tracking.</p>
</div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label font-weight-bold small text-uppercase">Full Name / Company</label>
                        <input type="text" name="name" class="form-control shadow-sm" placeholder="e.g. Acme Corp or John Doe" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold small text-uppercase">Email Address</label>
                            <input type="email" name="email" class="form-control shadow-sm" placeholder="email@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold small text-uppercase">Phone Number</label>
                            <input type="text" name="phone" class="form-control shadow-sm" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label font-weight-bold small text-uppercase">Billing Address</label>
                        <textarea name="address" class="form-control shadow-sm" rows="3" placeholder="Enter complete address..."></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow rounded-pill" style="background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%); border: none;">
                            Create Customer Profile
                        </button>
                        <a href="{% url 'acct_customer:customer_list' %}" class="btn btn-link text-muted mt-2">Cancel and Return</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


</div>
{% endblock %}
