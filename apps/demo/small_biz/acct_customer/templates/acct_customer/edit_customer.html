{% extends "inventory/base.html" %}

{% block content %}

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card shadow border-0 rounded-4">
<div class="card-body p-lg-5">
<div class="text-center mb-4">
<div class="icon icon-shape text-white rounded-circle shadow mb-3" style="width: 65px; height: 65px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(87deg, #2dce89 0, #2dcecc 100%);">
<i class="fas fa-user-edit fa-lg"></i>
</div>
<h2 class="h4">Edit Customer</h2>
<p class="text-muted small">Updating details for <strong>{{ acct_customer.name }}</strong></p>
</div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label font-weight-bold small text-uppercase">Full Name / Company</label>
                        <input type="text" name="name" class="form-control shadow-sm" value="{{ acct_customer.name }}" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold small text-uppercase">Email Address</label>
                            <input type="email" name="email" class="form-control shadow-sm" value="{{ acct_customer.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold small text-uppercase">Phone Number</label>
                            <input type="text" name="phone" class="form-control shadow-sm" value="{{ acct_customer.phone }}">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label font-weight-bold small text-uppercase">Billing Address</label>
                        <textarea name="address" class="form-control shadow-sm" rows="3">{{ acct_customer.address }}</textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg shadow rounded-pill" style="background: linear-gradient(87deg, #2dce89 0, #2dcecc 100%); border: none;">
                            Update Profile
                        </button>
                        <a href="{% url 'customer_list' %}" class="btn btn-link text-muted mt-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


</div>
{% endblock %}
