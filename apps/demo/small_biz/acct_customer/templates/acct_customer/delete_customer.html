{% extends "inventory/base.html" %}

{% block content %}

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card shadow border-0 rounded-4 text-center">
<div class="card-body p-lg-5">
<div class="icon icon-shape text-white rounded-circle shadow mb-4" style="width: 70px; height: 70px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(87deg, #f5365c 0, #f56036 100%);">
<i class="fas fa-exclamation-triangle fa-2x"></i>
</div>
<h2 class="h4 mb-3">Delete Customer?</h2>
<p class="text-muted mb-4">Are you sure you want to delete <strong>{{ acct_customer.name }}</strong>? This action will remove their profile and balance history from the system.</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg shadow rounded-pill">
                            Yes, Delete Permanently
                        </button>
                        <a href="{% url 'customer_list' %}" class="btn btn-outline-secondary rounded-pill mt-2">
                            No, Keep Profile
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


</div>
{% endblock %}
