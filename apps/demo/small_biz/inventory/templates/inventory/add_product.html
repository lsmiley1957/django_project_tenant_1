{% extends "inventory/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-transparent py-4">
                    <div class="row align-items-center">
                        <div class="col-8">
                            <h3 class="mb-0">Add New Inventory Item</h3>
                        </div>
                        <div class="col-4 text-end">
                            <a href="{% url 'product_list' %}" class="btn btn-sm btn-outline-secondary">Back to Catalog</a>
                        </div>
                    </div>
                </div>
                <div class="card-body p-lg-5">
                    <form method="POST">
                        {% csrf_token %}
                        <h6 class="heading-small text-muted mb-4">Product Information</h6>
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">SKU / Item ID</label>
                                    <input type="text" name="sku" class="form-control" placeholder="e.g. INV-001" required>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Product Name</label>
                                    <input type="text" name="name" class="form-control" placeholder="e.g. Wireless Mouse" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Category</label>
                                    <select name="category" class="form-select">
                                        <option value="">Select Category</option>
                                        {% for cat in categories %}
                                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Supplier</label>
                                    <select name="supplier" class="form-select">
                                        <option value="">Select Supplier</option>
                                        {% for sup in suppliers %}
                                        <option value="{{ sup.id }}">{{ sup.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">
                        <h6 class="heading-small text-muted mb-4">Stock & Pricing</h6>
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold text-danger">Cost Price ($)</label>
                                    <input type="number" step="0.01" name="cost_price" class="form-control" placeholder="0.00" required title="What we paid">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold text-success">Sale Price ($)</label>
                                    <input type="number" step="0.01" name="sale_price" class="form-control" placeholder="0.00" required title="What customer pays">
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Initial Stock</label>
                                    <input type="number" name="quantity_in_stock" class="form-control" value="0" required>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Reorder Level</label>
                                    <input type="number" name="reorder_level" class="form-control" value="10" required>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary btn-lg w-100 shadow" style="background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%); border: none;">
                                <i class="fas fa-plus-circle me-2"></i> Save Product to Inventory
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
