{% extends "inventory/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-transparent pb-0">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="{% url 'manage_categories' %}">Categories</a></li>
                            <li class="breadcrumb-item active">Edit Category</li>
                        </ol>
                    </nav>
                </div>
                <div class="card-body p-lg-5">
                    <div class="text-center mb-4">
                        <div class="icon icon-shape bg-gradient-primary text-white rounded-circle shadow mb-3" style="width: 60px; height: 60px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%);">
                            <i class="fas fa-tags fa-lg"></i>
                        </div>
                        <h2 class="h4">Edit Category</h2>
                        <p class="text-muted">{{ category.name }}</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Category Name</label>
                            <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label font-weight-bold">Description</label>
                            <textarea name="description" class="form-control" rows="4">{{ category.description }}</textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow" style="background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%); border: none;">
                                Update Category
                            </button>
                            <a href="{% url 'manage_categories' %}" class="btn btn-link text-muted mt-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
