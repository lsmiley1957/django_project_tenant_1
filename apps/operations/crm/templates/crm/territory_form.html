{% extends "crm/base.html" %}

{% block title %}
    {% if form.instance.pk %}Edit Territory% else %}Add Territory{% endif %}
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3>{% if form.instance.pk %}Edit Territory{% else %}Add New Territory{% endif %}</h3>
            </div>
            <div class="card-body">r
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'crm:teritory_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
