<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM App - {% block title %}{% endblock %}</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap)" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Light grey background */
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .card {
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }
        .form-control {
            display: block;
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #4a5568; /* Gray-700 */
            background-color: #ffffff;
            background-clip: padding-box;
            border: 1px solid #e2e8f0; /* Gray-200 */
            border-radius: 0.375rem; /* rounded-md */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-control:focus {
            border-color: #667eea; /* Indigo-500 */
            outline: 0;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25); /* Indigo-200 with opacity */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-indigo-600 p-4 shadow-md">
        <div class="container flex justify-between items-center">
            <a href="{% url 'crm:dashboard' %}" class="text-white text-2xl font-bold rounded-md px-3 py-2 hover:bg-indigo-700 transition duration-300">MyCRM</a>
            <div class="flex items-center space-x-4">
                <a href="{% url 'crm:dashboard' %}" class="text-white text-lg font-medium rounded-md px-3 py-2 hover:bg-indigo-700 transition duration-300">Dashboard</a>
                <a href="{% url 'crm:lead_list' %}" class="text-white text-lg font-medium rounded-md px-3 py-2 hover:bg-indigo-700 transition duration-300">Leads</a>
                <a href="{% url 'crm:opportunity_list' %}" class="text-white text-lg font-medium rounded-md px-3 py-2 hover:bg-indigo-700 transition duration-300">Opportunities</a>
                {% if user.is_authenticated %}
                    <span class="text-white text-lg font-medium">Hello, {{ user.username }}!</span>
                    <a href="{% url 'crm:logout' %}" class="bg-white text-indigo-600 px-4 py-2 rounded-md font-semibold hover:bg-gray-100 transition duration-300 shadow-sm">Logout</a>
                {% else %}
                    <a href="{% url 'crm:login' %}" class="bg-white text-indigo-600 px-4 py-2 rounded-md font-semibold hover:bg-gray-100 transition duration-300 shadow-sm">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow py-8">
        <div class="container">
            {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                        <div class="p-3 mb-2 rounded-md {% if message.tags == 'success' %}bg-green-100 text-green-800{% elif message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-800{% else %}bg-blue-100 text-blue-800{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center mt-auto">
        <div class="container">
            &copy; 2023 MyCRM App. All rights reserved.
        </div>
    </footer>
</body>
</html>
