<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project Manager{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .card { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .btn-primary { background: #2563eb; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.2s; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-danger { background: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <nav class="bg-white border-b border-slate-200 px-6 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-black tracking-tighter text-blue-600">Traxx Project Manager.</a>
            <div class="flex gap-6 text-sm font-bold text-slate-500 uppercase tracking-widest">
                <a href="{% url 'projects:project_list' %}" class="hover:text-blue-600">Projects</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-6 pb-12">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
