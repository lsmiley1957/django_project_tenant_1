<!DOCTYPE html>
{% load static %}
{% load tailwind_tags %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project Manager{% endblock %}</title>

    {% tailwind_css %}

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans antialiased">
    <nav class="bg-white border-b border-slate-200 px-6 py-4 mb-8 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-black tracking-tighter text-blue-600 hover:opacity-80 transition-opacity">
                Traxx Project Manager.
            </a>
            <div class="flex gap-6 text-[11px] font-black text-slate-500 uppercase tracking-widest">
                <a href="{% url 'projects:project_list' %}" class="hover:text-blue-600 transition-colors">Projects</a>
                </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pb-12">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
