{% extends 'projects/base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card p-8 max-w-2xl mx-auto">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">{{ title }}</h1>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">{{ field.label }}:</label>
                {{ field }}
                {% for error in field.errors %}
                    <p class="text-red-500 text-xs italic mt-1">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}
        <div class="flex justify-end gap-3 pt-4">
            <a href="{% url 'projects:project_list' %}" class="px-6 py-2 text-slate-500 font-bold">Cancel</a>
            <button type="submit" class="btn-primary px-8">Save Project</button>
        </div>
    </form>
</div>
{% endblock %}
