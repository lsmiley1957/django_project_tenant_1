{% extends 'projects/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="card p-8 max-w-md mx-auto text-center">
    <h1 class="text-3xl font-extrabold text-red-700 mb-6">Confirm Deletion</h1>
    <p class="text-gray-700 mb-6">Are you sure you want to delete this {{ delete_type|lower }}:</p>
    <p class="text-2xl font-semibold text-gray-900 mb-8">"{{ object.name }}"?</p>

    <form method="post" class="flex justify-center space-x-4">
        {% csrf_token %}
        <a href="{% if delete_type == 'Project' %}{% url 'projects:project_detail' object.pk %}{% else %}{% url 'projects:project_detail' object.project.pk %}{% endif %}" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-danger">Confirm Delete</button>
    </form>
</div>
{% endblock %}
