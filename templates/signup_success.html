<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Created! | MySaaS</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .success-card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
        }
        .header-accent {
            height: 8px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }
        .tenant-link-box {
            background-color: #eef2ff;
            border: 1px dashed #667eea;
            border-radius: 10px;
            padding: 15px;
            word-break: break-all;
        }
        .btn-launch {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-launch:hover {
            transform: translateY(-2px);
            color: white;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card success-card">
                <div class="header-accent"></div>
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#198754" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                          <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>

                    <h1 class="display-6 fw-bold mb-2">Workspace Created!</h1>
                    <p class="text-muted mb-4">Your private marketplace is live and ready for business.</p>

                    <div class="tenant-link-box mb-4">
                        <p class="small text-uppercase fw-bold text-muted mb-1">Your Unique URL</p>
                        <a href="{{ tenant_url }}" class="h5 text-decoration-none fw-bold" style="color: #764ba2;">
                            {{ tenant_url }}
                        </a>
                    </div>

                    <div class="d-grid gap-3">
                        <a href="{{ tenant_url }}marketplace/" class="btn btn-launch btn-lg">
                            Launch Marketplace →
                        </a>
                        <p class="small text-muted">
                            Log in with the credentials you just created.
                        </p>
                    </div>

                    <hr class="my-4">
                    <div class="text-center">
                        <p class="mb-1 small text-muted">Need to manage users or settings?</p>
                        <a href="{{ tenant_url }}admin/" class="small text-decoration-none">Access Admin Dashboard</a>
                    </div>
                </div>
            </div>
            <p class="text-center mt-4 text-muted small">
                Tip: Bookmark your unique URL for quick access.
            </p>
        </div>
    </div>
</div>

</body>
</html>
