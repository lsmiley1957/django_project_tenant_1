{% extends "marketplace/admin/admin_layout.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Edit {{ app.name }}</h2>
            <p class="text-muted">Modify application settings, pricing tiers, and assets.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="{% url 'marketplace_admin_list' %}" class="btn btn-outline-secondary rounded-pill">Cancel</a>
            <button type="submit" form="appForm" class="btn btn-primary rounded-pill px-4">Update Application</button>
        </div>
    </div>

    {% include "marketplace/admin/app_form.html" %}
</div>
{% endblock %}
