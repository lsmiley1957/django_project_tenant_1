<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Admin | MySaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: #0f172a; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .main-content { margin-left: 280px; flex-grow: 1; padding: 2rem; }
        .nav-link { color: #94a3b8; display: flex; align-items: center; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 8px; margin: 0 1rem 0.25rem; }
        .nav-link:hover, .nav-link.active { background: #1e293b; color: white; }
        .nav-link i { margin-right: 12px; width: 20px; }
        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; color: #475569; letter-spacing: 0.1em; padding: 1.5rem 2.5rem 0.5rem; font-weight: 700; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="p-4 d-flex align-items-center mb-4">
        <div class="bg-primary p-2 rounded me-2">
            <i data-lucide="shield-check" class="text-white"></i>
        </div>
        <span class="fw-bold fs-5">System Admin</span>
          <nav class="flex-grow-1">
          <div class="nav-section-title">Catalog Management</div>
          <a href="{% url 'marketplace_admin_list' %}" class="nav-link {% if 'apps' in request.path %}active{% endif %}">
              <i data-lucide="package"></i> Applications
          </a>
          <a href="{% url 'kb_admin_list' %}" class="nav-link {% if 'kb' in request.path %}active{% endif %}">
              <i data-lucide="book-open"></i> Knowledge Base
          </a>

          <div class="nav-section-title">System Tools</div>
          <a href="/admin/" class="nav-link">
              <i data-lucide="database"></i> Django Admin
          </a>
          <a href="/" class="nav-link">
              <i data-lucide="home"></i> Public Site
          </a>
      </nav>

      <div class="p-4 border-top border-secondary mt-auto">
          <div class="small text-muted mb-1">Authenticated as</div>
          <div class="fw-bold text-white">{{ request.user.username }}</div>
      </div>

</div>

<main class="main-content">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

<script>lucide.createIcons();</script>
</body>
</html>
