{% extends "marketplace/admin/admin_layout.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg mt-5">
                <div class="card-body p-5 text-center">
                    <div class="bg-danger-subtle text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
                        <i data-lucide="alert-triangle" style="width: 40px; height: 40px;"></i>
                    </div>
                    
                    <h3 class="fw-bold mb-3">Delete Application?</h3>
                    <p class="text-muted mb-4">
                        Are you sure you want to delete <strong>"{{ app.name }}"</strong>? 
                        <br><br>
                        This will remove the application from the marketplace for all tenants. This action cannot be undone.
                    </p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg rounded-pill fw-bold">
                                Yes, Delete Permanently
                            </button>
                            <a href="{% url 'marketplace_admin_list' %}" class="btn btn-light btn-lg rounded-pill text-muted">
                                No, Keep It
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialize Lucide icons if they aren't auto-loaded
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
</script>
{% endblock %}
