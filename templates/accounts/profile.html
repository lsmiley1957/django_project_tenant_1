<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | {{ tenant.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .profile-card { border: none; border-radius: 15px; overflow: hidden; }
        .profile-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px; }
        .avatar-circle { width: 80px; height: 80px; background: white; color: #764ba2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin: 0 auto 15px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card profile-card shadow">
                <div class="profile-header text-center">
                    <div class="avatar-circle shadow-sm">
                        {{ user.username|first|upper }}
                    </div>
                    <h3 class="mb-0">{{ user.username }}</h3>
                    <p class="small opacity-75">{{ tenant.name }} Member</p>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <p class="text-muted mb-1">Email Address</p>
                        <h6 class="fw-bold">{{ user.email|default:user.username }}</h6>
                    </div>
                    <hr>
                    <div class="d-grid gap-2">
                        <a href="{% url 'dashboard_home' %}" class="btn btn-primary py-2 fw-bold shadow-sm">
                            Enter Workspace Dashboard
                        </a>
                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link text-muted text-decoration-none small">
                                Sign Out
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
