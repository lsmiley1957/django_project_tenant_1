{% extends "inventory/base.html" %}

{% block content %}
<script src="https://cdn.ckeditor.com/ckeditor5/36.0.1/classic/ckeditor.js"></script>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Company Policies</h2>
        <button class="btn btn-primary" onclick="openPolicyModal()">+ Create Policy</button>
    </div>

    <div class="row">
        {% for p in policies %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <span class="badge badge-soft-primary mb-2">{{ p.category }}</span>
                    <h5>{{ p.title }}</h5>
                    <button class="btn btn-sm btn-outline-primary" 
                            onclick="editPolicy('{{ p.id }}', '{{ p.title|escapejs }}', '{{ p.category }}', `{{ p.content|safe }}`)">
                        Edit content
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Simple Policy Modal -->
<div class="modal fade" id="policyModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Policy Editor</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="policy_id">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="p_title" class="form-control">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="p_category" class="form-control">
                        <option value="General">General</option>
                        <option value="HR">HR</option>
                        <option value="Security">Security</option>
                    </select>
                </div>
                <div id="editor"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="savePolicy()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script>
let editorInstance;
ClassicEditor.create(document.querySelector('#editor')).then(ed => editorInstance = ed);

function openPolicyModal() {
    document.getElementById('policy_id').value = '';
    document.getElementById('p_title').value = '';
    editorInstance.setData('');
    $('#policyModal').modal('show');
}

function editPolicy(id, title, cat, content) {
    document.getElementById('policy_id').value = id;
    document.getElementById('p_title').value = title;
    document.getElementById('p_category').value = cat;
    editorInstance.setData(content);
    $('#policyModal').modal('show');
}

function savePolicy() {
    const data = new FormData();
    data.append('policy_id', document.getElementById('policy_id').value);
    data.append('title', document.getElementById('p_title').value);
    data.append('category', document.getElementById('p_category').value);
    data.append('content', editorInstance.getData());
    data.append('csrfmiddlewaretoken', '{{ csrf_token }}');

    fetch(window.location.href, { method: 'POST', body: data, headers: {'X-Requested-With': 'XMLHttpRequest'} })
        .then(() => window.location.reload());
}
</script>
{% endblock %}
